<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vega-Lite Visualizations</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.21.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.21.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 50px; color: white; }
        header h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        header p { font-size: 1.1rem; opacity: 0.95; }
        .card {
            background: white; border-radius: 16px; padding: 30px;
            margin-bottom: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .card h2 { font-size: 1.5rem; font-weight: 600; color: #333; margin-bottom: 20px; }
        .chart { width: 100%; height: 400px; }
        footer { text-align: center; color: white; margin-top: 40px; opacity: 0.9; font-size: 0.9rem; }
        @media (max-width: 768px) { .card { padding: 20px; } header h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vega-Lite Visualizations</h1>
            <p>Two charts loaded from spec files</p>
        </header>

        <div class="card">
            <h2>Bar Chart</h2>
            <div id="chart-bar" class="chart"></div>
        </div>

        <div class="card">
            <h2>Line Chart</h2>
            <div id="chart-line" class="chart"></div>
        </div>

        <footer>Built with Vega-Lite</footer>
    </div>

    <script>
        function loadSpec(file) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', file, false);
            xhr.send();
            return JSON.parse(xhr.responseText);
        }

        var barSpec = loadSpec('spec-bar.json');
        var lineSpec = loadSpec('spec-line.json');

        vegaEmbed('#chart-bar', barSpec, { actions: false, theme: 'default' });
        vegaEmbed('#chart-line', lineSpec, { actions: false, theme: 'default' });
    </script>
</body>
</html>
