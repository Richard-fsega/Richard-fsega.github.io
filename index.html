<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vega-Lite Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5/build/vega-lite.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 50%, #48dbfb 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            color: #fff;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
            color: #fff;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 80px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            border-radius: 2px;
        }

        #vis {
            width: 100%;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .diagram {
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        .mermaid {
            font-size: 16px;
        }

        .photo-section {
            text-align: center;
        }

        .photo-section img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            object-fit: cover;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            opacity: 0.9;
            font-size: 0.9rem;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vega-Lite Visualization</h1>
            <p>Interactive data visualizations with diagrams</p>
        </header>

        <div class="card">
            <h2>Bar Chart</h2>
            <div id="vis"></div>
        </div>

        <div class="card">
            <h2>Flowchart Diagram</h2>
            <div class="diagram">
                <pre class="mermaid">
flowchart TD
    A[Start] --> B{Is it working?}
    B -->|Yes| C[Success]
    B -->|No| D[Fix issue]
    D --> B
                </pre>
            </div>
        </div>

        <div class="card">
            <h2>Cristiano Ronaldo</h2>
            <div class="photo-section">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/8e/Cristiano_Ronaldo_2018.jpg" alt="Cristiano Ronaldo">
            </div>
        </div>

        <footer>
            Built with Vega-Lite & Mermaid
        </footer>
    </div>

    <script>
        async function loadChart() {
            const response = await fetch('chart-spec.json');
            const spec = await response.json();
            vegaEmbed('#vis', spec, { actions: false, theme: 'default' });
        }
        loadChart();
        mermaid.initialize({ startOnLoad: true, theme: 'default' });
    </script>
</body>
</html>
