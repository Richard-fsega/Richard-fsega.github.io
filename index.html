<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vega-Lite Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5.21.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.21.0"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1rem;
            color: #666;
        }

        #vis {
            width: 100%;
            height: 500px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vega-Lite Visualization</h1>
            <p>Interactive data visualization</p>
        </header>
        <div id="vis"></div>
    </div>

    <script>
        const spec = {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "description": "A simple bar chart",
            "data": {
                "values": [
                    {"category": "A", "value": 30},
                    {"category": "B", "value": 80},
                    {"category": "C", "value": 45},
                    {"category": "D", "value": 60}
                ]
            },
            "mark": {
                "type": "bar",
                "cornerRadius": 8,
                "tooltip": true,
                "color": "#667eea"
            },
            "encoding": {
                "x": {
                    "field": "category",
                    "type": "nominal",
                    "title": "Category",
                    "axis": {"labelFontSize": 14, "titleFontSize": 16}
                },
                "y": {
                    "field": "value",
                    "type": "quantitative",
                    "title": "Value",
                    "axis": {"labelFontSize": 14, "titleFontSize": 16}
                }
            },
            "width": "100%",
            "height": 400,
            "config": {
                "view": {"stroke": "transparent"},
                "axis": {"domainWidth": 1.5}
            }
        };

        vegaEmbed('#vis', spec, { actions: false, theme: 'default' });
    </script>
</body>
</html>
